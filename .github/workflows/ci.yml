name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Единая команда (docs/10-quality-gates.md §3): typecheck, lint,
      # format:check, test:unit, build, budget, i18n:coverage, lighthouse.
      # GitHub-hosted ubuntu-latest runners поставляются с предустановленным
      # Chrome (задокументировано в actions/runner-images) — отдельная
      # установка/CHROME_PATH не нужны. Не проверено на реальном раннере
      # в этой сессии (нет удалённого репозитория, см. T-006c) — только
      # локально, где Chrome пришлось указывать явным CHROME_PATH.
      - name: Check
        run: npm run check
